<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body >

    <div class="card formulario-card">
      <div class="text-center cabecera-logo">
        <h1 class="titulo-logo">Puente<span class="logo-morado">Lab</span></h1>
        <p class="subtitulo">Tu futuro, más cerca</p>
    </div>

    <div class="campo">
        <label class="form-label">Nombre completo</label>
        <input type="text" class="form-control" placeholder="Ej. María López">
    </div>

    <div class="campo">
        <label class="form-label">Email</label>
        <input type="text" class="form-control" placeholder="Ej.man@gmail.com">
    </div>

    <div class="campo">
        <label class="form-label">Contraseña</label>
        <input type="text" class="form-control" placeholder="MaximoAntonio1">
    </div>

    <div class="row">
        <div class="col-6 campo">
          <label class="form-label">Edad</label>
          <input type="number" class="form-control" placeholder="Ej. 18">
        </div>

        <div class="col-6 campo">
            <label class="form-label">Género</label>
            <select class="form-select"><option selected>Seleccioná</option></select>
        </div>
    </div>

    <div class="campo">
        <label class="form-label">Orientación / Intereses</label>
        <select class="form-select"><option selected>Seleccioná</option></select>
    </div>

    <div class="campo">
        <label class="form-label">¿Qué estás estudiando?</label>
        <select class="form-select"><option selected>Programación</option></select>
    </div>  

    <div class="campo-check">
        <input class="form-check-input" type="checkbox" id="terms">
        <label class="form-check-label small" for="terms">Acepto <a href="#" class="link-terminos">términos y condiciones</a></label>
    </div>

    <button type="submit" class="btn btn-registrar w-100 text-white">Registrar</button>
    </form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
