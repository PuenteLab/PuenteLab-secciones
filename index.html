<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | PuenteLab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header class="navbar-auth">
    <div class="container-fluid px-5">
        <a href="seccion-inicio.html" class="marca-auth">
            <span>Puente<span class="marca-morado">Lab</span></span>
        </a>

        <a href="seccion-inicio.html" class="link-volver">
            <i class="bi bi-arrow-left"></i> Volver al Inicio
        </a>
    </div>
</header>

<main class="contenedor-auth">
    <div class="card formulario-card">

        <div class="text-center cabecera-logo">
            <h1 class="titulo-logo">Puente<span class="logo-morado">Lab</span></h1>
            <p class="subtitulo">Tu futuro, más cerca</p>
        </div>

        <form>
            <div class="campo">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" placeholder="Ej. María López">
            </div>

            <div class="campo">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Ej.man@gmail.com">
            </div>

            <div class="campo">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" placeholder="MaximoAntonio1">
            </div>

            <div class="row">
                <div class="col-md-6 campo">
                    <label class="form-label">Edad</label>
                    <input type="number" class="form-control" placeholder="Ej. 18">
                </div>

                <div class="col-md-6 campo">
                    <label class="form-label">Género</label>
                    <select class="form-select">
                        <option selected>Seleccioná</option>
                        <option value="femenino">Femenino</option>
                        <option value="masculino">Masculino</option>
                        <option value="otro">Otro</option>
                        <option value="no-indica">Prefiero no decir</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label class="form-label">Orientación / Intereses</label>
                <select class="form-select">
                    <option selected>Seleccioná</option>
                    <option value="programacion">Programación</option>
                    <option value="diseno">Diseño</option>
                    <option value="marketing">Marketing</option>
                    <option value="negocios">Negocios</option>
                </select>
            </div>

            <div class="campo">
                <label class="form-label">¿Qué estás estudiando?</label>
                <select class="form-select">
                    <option selected>Programación</option>
                    <option value="informatica">Informática</option>
                    <option value="diseno-ux">Diseño UX/UI</option>
                    <option value="marketing-digital">Marketing Digital</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="campo-check">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label small" for="terms">
                    Acepto <a href="#" class="link-terminos">términos y condiciones</a>
                </label>
            </div>

            <a class="btn btn-registrar w-100 text-white" href="./seccion-inicio.html">
                Registrar
            </a>
        </form>

        <div class="cambio-auth">
            <span>¿Ya tenés una cuenta?</span>
            <a href="login.html">Iniciá sesión</a>
        </div>

    </div>
</main>

<footer class="footer-auth">
    <div class="container">
        <div class="footer-contenido">
            <div>
                <h3>Puente<span>Lab</span></h3>
                <p>Conectando estudiantes con su futuro profesional.</p>
            </div>

            <div class="footer-datos">
                <span>Proyecto educativo</span>
                <span>4.º año</span>
                <span>2026</span>
            </div>
        </div>

        <div class="footer-final">
            <span>© 2026 PuenteLab. Todos los derechos reservados.</span>
            <span>Aprender, conectar y crecer.</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
